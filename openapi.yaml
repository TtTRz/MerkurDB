openapi: "3.0.3"
info:
  title: MerkurDB
  version: "0.4.0"
  description: |
    Standalone cognitive memory service for AI agents.
    MerkurDB is an independent HTTP memory service supporting memory writes, hybrid semantic/keyword search, graph diffusion,
    memory consolidation, and forgetting curve management.
  contact:
    name: MerkurDB
  license:
    name: MIT

servers:
  - url: http://localhost:1934/v1
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Write
    description: Memory write
  - name: Search
    description: Memory search
  - name: Memory
    description: Single memory management
  - name: Graph
    description: Memory graph
  - name: Lifecycle
    description: Consolidation & forgetting
  - name: Status
    description: Service statistics
  - name: Admin
    description: Operations & audit

paths:
  /health:
    get:
      tags: [Admin]
      summary: Health check
      operationId: health
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: "0.1.0"

  /write:
    post:
      tags: [Write]
      summary: Write a memory
      operationId: write
      parameters:
        - $ref: "#/components/parameters/NamespaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Memory text content
                context:
                  type: object
                  additionalProperties:
                    type: string
                  description: Context tags (agent, session, topic, etc.)
                metadata:
                  type: object
                  description: Custom metadata
            example:
              content: "v8 GC is generational"
              context:
                agent: "test"
      responses:
        "201":
          description: Memory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResponse"
        "500":
          $ref: "#/components/responses/Error"

  /write-batch:
    post:
      tags: [Write]
      summary: Batch write memories
      operationId: writeBatch
      parameters:
        - $ref: "#/components/parameters/NamespaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [content]
                    properties:
                      content:
                        type: string
                      context:
                        type: object
                        additionalProperties:
                          type: string
                      metadata:
                        type: object
            example:
              items:
                - content: "memory 1"
                - content: "memory 2"
      responses:
        "201":
          description: Batch write successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
                  requested:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                  time_ms:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /search:
    get:
      tags: [Search]
      summary: Search memories
      operationId: search
      parameters:
        - $ref: "#/components/parameters/NamespaceHeader"
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query text
        - name: mode
          in: query
          schema:
            type: string
            enum: [hybrid, fast, deep]
            default: hybrid
          description: hybrid=BM25 x vector RRF fusion (default), fast=vector retrieval, deep=BFS graph diffusion
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: score_threshold
          in: query
          schema:
            type: number
            minimum: -1
            maximum: 1
            default: 0.3
          description: Relevance floor. Gates raw cosine in fast mode and the normalized RRF fused relevance in hybrid mode (not the composite score, whose weight/importance shares would otherwise set a floor). Ignored by deep mode ranking.
        - name: context
          in: query
          schema:
            type: string
          description: JSON context filter, e.g. '{"agent":"test"}'
        - name: include_graph
          in: query
          schema:
            type: boolean
            default: false
          description: Include the induced subgraph over the served page (edges whose endpoints are both in the result set)
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 5
            default: 2
          description: BFS depth (deep mode only). Hard upper bound is 5.
        - name: degree_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Max neighbors per node (deep mode only). Hard upper bound is 100.
        - name: level
          in: query
          schema:
            type: string
          description: Comma-separated level filter, e.g. "Full,Summary"
        - name: category
          in: query
          schema:
            type: string
          description: Exact category match
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start date inclusive (RFC 3339)
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End date inclusive (RFC 3339)
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "500":
          $ref: "#/components/responses/Error"

  /memory/{id}:
    get:
      tags: [Memory]
      summary: Get memory details
      operationId: getMemory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Memory details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Memory]
      summary: Update memory content
      operationId: updateMemory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: New memory content
            example:
              content: "updated memory content"
      responses:
        "200":
          description: Update successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: updated
                  id:
                    type: string
    delete:
      tags: [Memory]
      summary: Delete memory
      operationId: deleteMemory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  id:
                    type: string

  /graph/{id}:
    get:
      tags: [Graph]
      summary: View memory graph neighborhood
      operationId: getGraph
      parameters:
        - $ref: "#/components/parameters/NamespaceHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Center memory ID
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
            default: 2
        - name: degree_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Graph neighborhood (bucket-scoped; edges form the induced subgraph over the returned nodes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  center:
                    type: string
                  depth:
                    type: integer
                  degree_limit:
                    type: integer
                  neighborhood:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        content:
                          type: string
                        abstract:
                          type: string
                        score:
                          type: number
                        level:
                          type: string
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        source_id:
                          type: string
                        target_id:
                          type: string
                        weight:
                          type: number
                        relation:
                          type: string
                        edge_type:
                          type: string
                          enum: [auto, manual]

  /context:
    post:
      tags: [Search]
      summary: Assemble a token-budgeted context digest
      description: Hybrid recall, MMR dedup, then greedy packing under the token budget. Returns a prompt-ready digest plus the surviving items.
      operationId: assembleContext
      parameters:
        - $ref: "#/components/parameters/NamespaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q, token_budget]
              properties:
                q:
                  type: string
                  description: Free-text query steering the hybrid recall
                token_budget:
                  type: integer
                  minimum: 1
                  description: Hard ceiling on the digest's approximate token count (chars/4 heuristic)
                limit:
                  type: integer
                  minimum: 1
                  maximum: 200
                  default: 50
                  description: Recall width before dedup/packing
            example:
              q: "postgres vacuum tuning"
              token_budget: 512
      responses:
        "200":
          description: Assembled context
          content:
            application/json:
              schema:
                type: object
                properties:
                  digest:
                    type: string
                    description: Prompt-ready bullet list of packed memory contents
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        content:
                          type: string
                        score:
                          type: number
                        weight:
                          type: number
                        importance:
                          type: number
                        namespace:
                          type: string
                  token_estimate:
                    type: integer
                  dropped:
                    type: integer
                    description: Recalled items that did not fit the budget
        "400":
          $ref: "#/components/responses/Error"

  /relate:
    post:
      tags: [Graph]
      summary: Manually create an edge
      operationId: relate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, target_id]
              properties:
                source_id:
                  type: string
                target_id:
                  type: string
                weight:
                  type: number
                  default: 1.0
                relation:
                  type: string
            example:
              source_id: "mem_abc"
              target_id: "mem_def"
              weight: 0.8
              relation: "related_to"
      responses:
        "201":
          description: Edge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: edge_created
        "400":
          description: Self-edge or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source or target memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /relate-batch:
    post:
      tags: [Graph]
      summary: Batch create edges
      operationId: relateBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edges]
              properties:
                edges:
                  type: array
                  items:
                    type: object
                    required: [source_id, target_id]
                    properties:
                      source_id:
                        type: string
                      target_id:
                        type: string
                      weight:
                        type: number
                      relation:
                        type: string
            example:
              edges:
                - source_id: "mem_a"
                  target_id: "mem_b"
                  relation: "related"
                - source_id: "mem_b"
                  target_id: "mem_c"
                  weight: 0.5
      responses:
        "201":
          description: Batch create results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  created:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
        "400":
          description: Batch exceeds limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consolidate:
    post:
      tags: [Lifecycle]
      summary: Manually trigger consolidation
      description: Feed pending memories to consolidator for summarization and edge creation
      operationId: triggerConsolidate
      responses:
        "200":
          description: Consolidation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  processed:
                    type: integer
                  edges_created:
                    type: integer
                  absorptions:
                    type: integer
                    description: Pending memories folded into an existing one by an UPDATE verdict (P1-7)
                  invalidations:
                    type: integer
                    description: Memories soft-invalidated by a DELETE verdict (P1-7)
                  errors:
                    type: integer
              example:
                status: "ok"
                processed: 5
                edges_created: 3
                absorptions: 1
                invalidations: 0
                errors: 0

  /consolidate/log:
    get:
      tags: [Lifecycle]
      summary: Get consolidation audit log
      operationId: consolidationLog
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Max entries to return
      responses:
        "200":
          description: Consolidation log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        started_at:
                          type: string
                          format: date-time
                        finished_at:
                          type: string
                          format: date-time
                        memories_processed:
                          type: integer
                        edges_created:
                          type: integer
                        errors:
                          type: integer

  /forget:
    post:
      tags: [Lifecycle]
      summary: Manually trigger forgetting evaluation
      description: Evaluate memory weights via forgetting curve, perform downgrade/archive/cleanup
      operationId: triggerForget
      responses:
        "200":
          description: Forgetting results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  archived:
                    type: integer
                  downgraded:
                    type: integer
                  upgraded:
                    type: integer
                    description: Memories promoted one level by demonstrated demand (hysteresis promotion)
                  cleaned:
                    type: integer
                  purged:
                    type: integer
                    description: Invalidated memories hard-deleted past the audit window (P1-7)
              example:
                status: "ok"
                archived: 2
                downgraded: 1
                upgraded: 1
                cleaned: 0
                purged: 0

  /status:
    get:
      tags: [Status]
      summary: Get storage statistics
      operationId: status
      responses:
        "200":
          description: Storage statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    NamespaceHeader:
      name: X-Merkur-Namespace
      in: header
      required: false
      schema:
        type: string
        default: default
      description: Logical isolation bucket for this request. Missing/empty falls back to `default`. Logical isolation only — not a security boundary.
  schemas:
    Memory:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        abstract:
          type: string
        category:
          type: string
        weight:
          type: number
        level:
          type: string
          enum: [full, summary, title, archived]
          description: Lower-case enum to match the wire format.
        pending_consolidation:
          type: boolean
        metadata:
          type: object
        context:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        accessed_at:
          type: string
          format: date-time
        access_count:
          type: integer
        namespace:
          type: string
          description: Logical isolation bucket (set via X-Merkur-Namespace at write time; not a security boundary)
        importance:
          type: number
          description: System-learned salience in [0, 1], written only by the Consolidator; new memories carry the neutral 0.5 prior
        valid_at:
          type: string
          format: date-time
          description: When the fact became valid (currently always equals created_at)
        invalid_at:
          type: string
          format: date-time
          nullable: true
          description: Soft-invalidation timestamp (Consolidator adjudication); set rows are hidden from retrieval but kept for audit until the retention purge

    WriteResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          example: ok
        searchable:
          type: boolean
        time_ms:
          type: integer

    ScoredMemory:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        abstract:
          type: string
        score:
          type: number
          description: Composite score (0.5 relevance + 0.2 weight + 0.3 importance at default weights)
        weight:
          type: number
        level:
          type: string
        category:
          type: string
        context:
          type: object
        created_at:
          type: string
          format: date-time
        namespace:
          type: string
        importance:
          type: number

    SearchResponse:
      type: object
      properties:
        mode:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/ScoredMemory"
        total:
          type: integer
        time_ms:
          type: integer
        filters:
          type: object
          properties:
            level:
              type: string
              nullable: true
            category:
              type: string
              nullable: true
            from:
              type: string
              nullable: true
            to:
              type: string
              nullable: true
        graph:
          nullable: true
          type: object

    StatusResponse:
      type: object
      properties:
        total_memories:
          type: integer
        total_edges:
          type: integer
        pending_consolidation:
          type: integer
        by_level:
          type: object
          additionalProperties:
            type: integer
        uptime_seconds:
          type: integer
          nullable: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
