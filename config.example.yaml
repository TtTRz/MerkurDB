server:
  host: "127.0.0.1"
  port: 1934
  # Comma-separated list of allowed CORS origins. Use "*" only with dev_mode=true.
  cors_allow_origin: "http://localhost:3000"
  # Set to true to relax production safeguards (allow `*` CORS, no auth tokens).
  # Never enable in production.
  dev_mode: false

# Storage backend: "sqlite" (default) or "lancedb" (requires --features lancedb)
storage:
  type: "sqlite"
  sqlite:
    path: "~/.merkur/data/merkur.db"
  # lancedb:
  #   lance_path: "~/.merkur/data/vectors"
  #   sqlite_path: "~/.merkur/data/merkur.db"

plugins:
  # Embedder: "noop" (default), "ollama", or "openai" (requires --features openai)
  embedder:
    type: "noop"
    noop:
      dim: 384
    # ollama:
    #   base_url: "http://localhost:11434"
    #   model: "all-minilm"
    # openai:
    #   base_url: "https://api.openai.com"
    #   api_key: "sk-..."           # Prefer MERKUR_PLUGINS__EMBEDDER__OPENAI__API_KEY env var
    #   model: "text-embedding-3-small"
    #   dimensions: 512             # Optional output-dim override for v3 models

  # Consolidator: "noop" (default) or "llm"
  consolidator:
    type: "noop"
    # llm:
    #   base_url: "http://localhost:11434"
    #   model: "qwen2.5:7b"
    #   backend: "ollama"       # "ollama" (default) or "openai"

retrieval:
  fast_default_limit: 10
  score_threshold: 0.3
  default_depth: 2
  default_degree_limit: 10

# Authentication: provide one or more bearer tokens. Empty list + `disabled: false`
# is rejected at startup unless `server.dev_mode = true`.
auth:
  tokens:
    - "replace-me-with-a-strong-token"
  disabled: false

# Offline consolidation: summarize memories, extract entities, build edges
consolidation:
  interval_seconds: 60
  batch_size: 10
  # Write governance (P1-7): the Consolidator adjudicates each pending memory
  # against its nearest neighbors (mem0-style UPDATE/DELETE). Verdicts execute
  # only when the pair's cosine similarity clears adjudication_floor — the
  # second signal of the dual-signal rule. Only effective with an LLM
  # consolidator (plugins.consolidator.type: "llm"); noop adjudicates nothing.
  adjudication_floor: 0.6
  adjudication_candidates: 5

# Write-time dedup (P2-8): top-1 cosine similarity above the threshold makes
# a write NOOP onto the existing memory in the same namespace.
write:
  dedup_enabled: true
  dedup_threshold: 0.92
  # Reserved: UPDATE/DELETE adjudication runs in the async Consolidator only.
  # Only "async" is accepted today.
  adjudication: "async"

# Ebbinghaus forgetting curve: decay, downgrade/upgrade, archive
forgetting:
  interval_seconds: 300
  batch_size: 100
  archive_days: 30
  # Soft-invalidated memories (Consolidator adjudication) are hidden from
  # retrieval immediately and hard-deleted after this audit window.
  purge_invalidated_days: 30
  decay_factor: 0.9        # legacy; not used by current formula
  half_life_seconds: 86400 # weight halves every `half_life_seconds`
  access_boost: 0.1
  threshold_to_l1: 0.3
  threshold_to_l0: 0.2
  threshold_archive: 0.1
  # Access-driven promotion (hysteresis): a demoted memory climbs one rung
  # back up only when its derived weight clears this bar AND it has been
  # retrieved at least upgrade_min_access_count times. Must exceed
  # threshold_to_l1 — validation rejects oscillating configurations.
  threshold_upgrade: 0.6
  upgrade_min_access_count: 3

logging:
  level: "info"
  format: "text"

# Rate limiting: token bucket per server (disabled by default)
rate_limit:
  enabled: false
  requests_per_second: 100
